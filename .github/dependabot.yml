version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: 10 7 4 * *
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      bun-security:
        applies-to: security-updates
        patterns:
          - '*'
      bun-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directories:
      - /
      - /.woodpecker
    schedule:
      interval: cron
      cronjob: 20 7 4 * *
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - '*'
      docker-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: 30 7 4 * *
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      docker-compose-security:
        applies-to: security-updates
        patterns:
          - '*'
      docker-compose-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
